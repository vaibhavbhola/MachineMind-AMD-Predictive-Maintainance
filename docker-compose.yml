version: '3.8'

services:
  machinemind:
    build: .
    container_name: machinemind-app
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./exports:/app/exports
      - ./data:/app/data
      - ./models:/app/models
